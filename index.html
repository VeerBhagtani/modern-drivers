<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modern Drivers</title>
<link rel="icon" href="mark.png">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css?v=b60ca5b">
<script src="vendor/maplibre/maplibre-gl-csp.js" defer></script>
<link rel="stylesheet" href="theme.css?v=b60ca5b">
</head>
<body>

<div id="login" class="signin-bg" hidden>
  <div class="signin">
    <img src="logo.png" alt="Modern Drivers">
    <p class="sub">Office dashboard</p>
    <div class="field" id="serverField" hidden>
      <label for="apiBase">Server address</label>
      <input id="apiBase" type="url" inputmode="url" autocapitalize="none" spellcheck="false"
             placeholder="https://modern-drivers-api-xxxxx.a.run.app">
      <p class="tiny" style="margin:6px 0 0">The address the deploy printed. Asked once, then remembered on this computer.</p>
    </div>
    <div class="field"><label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password"></div>
    <p id="loginErr" class="err" hidden></p>
    <button id="btnLogin" class="btn-primary">Sign in</button>
    <p class="tiny" style="text-align:center;margin-top:18px">
      Closing this tab signs you out.<br>
      <button id="btnServer" class="link-sm" hidden>Change server address</button>
    </p>
  </div>
</div>

<div id="app" hidden>
  <div class="topbar">
    <img src="mark.png" alt="">
    <h1>Modern Drivers</h1>
    <span class="sp"></span>
    <span id="whoami" class="meta"></span>
    <span id="clock" class="meta"></span>
    <button id="btnPassword"><span class="wide-only">Change </span>password</button>
    <button id="btnSignout">Sign out</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="view"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script src="config.js?v=b60ca5b"></script>
<script src="xlsx.js?v=b60ca5b"></script>
<script src="api.js?v=b60ca5b"></script>
<script src="map.js?v=b60ca5b"></script>
<script src="views.js?v=b60ca5b"></script>
<script src="app.js?v=b60ca5b"></script>
<script src="responsive.js"></script>
</body>
</html>
